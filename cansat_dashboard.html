<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CanSat Ground Station</title>
<style>
:root{--bg:#0b0f17;--card:#141b28;--line:#243047;--tx:#e6edf7;--mu:#7d8aa3;--ac:#4cc9f0;--ok:#4ade80;--wa:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 auto 0 0}button{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--ac)}#st{padding:3px 10px;border-radius:99px;background:#222c3f;color:var(--mu)}
#view{position:relative;min-height:300px}#view canvas{display:block}
#hud{position:absolute;left:12px;top:12px;font:13px ui-monospace,monospace;color:var(--mu);line-height:1.6}#hud b{color:var(--tx)}
#side{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.c small{color:var(--mu);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.c span{font:600 20px ui-monospace,monospace}.c i{font-style:normal;color:var(--mu);font-size:12px}
canvas.ch{width:100%;height:110px;background:var(--card);border:1px solid var(--line);border-radius:10px}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 45vh auto;height:auto}header{grid-column:1}}
</style></head><body>
<header><h1>🚀 CanSat Ground Station</h1><span id="st">disconnected</span>
<button id="bC">Connect USB</button><button id="bD">Demo mode</button><button id="bZ">Zero (calibrate)</button><button id="bS">Download CSV</button></header>
<div id="view"><div id="hud"></div></div>
<div id="side">
 <div class="grid">
  <div class="c"><small>Altitude</small><span id="alt">0</span> <i>m</i></div>
  <div class="c"><small>Vert. speed</small><span id="vs">0</span> <i>m/s</i></div>
  <div class="c"><small>Phase</small><span id="ph" style="font-size:16px">PAD</span></div>
  <div class="c"><small>Max altitude</small><span id="mAlt">0</span> <i>m</i></div>
  <div class="c"><small>Max speed</small><span id="mVs">0</span> <i>m/s</i></div>
  <div class="c"><small>Max accel</small><span id="mG">0</span> <i>g</i></div>
  <div class="c"><small>Temperature</small><span id="tmp">0</span> <i>°C</i></div>
  <div class="c"><small>Humidity</small><span id="hum">0</span> <i>%</i></div>
  <div class="c"><small>Pressure</small><span id="prs">0</span> <i>hPa</i></div>
  <div class="c"><small>Roll</small><span id="rl">0</span> <i>°</i></div>
  <div class="c"><small>Pitch</small><span id="pt">0</span> <i>°</i></div>
  <div class="c"><small>Yaw</small><span id="yw">0</span> <i>°</i></div>
  <div class="c"><small>Accel |a|</small><span id="ag">0</span> <i>g</i></div>
  <div class="c"><small>Spin rate</small><span id="sp">0</span> <i>°/s</i></div>
  <div class="c"><small>Time</small><span id="tm">0</span> <i>s</i></div>
 </div>
 <canvas class="ch" id="c1"></canvas><canvas class="ch" id="c2"></canvas><canvas class="ch" id="c3"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
// ---------- 3D scene ----------
const view=$('view'),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(devicePixelRatio);view.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x0b0f17);
const cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.set(4,2.5,5);cam.lookAt(0,0,0);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(3,5,4);
S.add(new THREE.HemisphereLight(0xffffff,0x222233,1),sun);
S.add(new THREE.GridHelper(10,20,0x334155,0x1e293b));S.add(new THREE.AxesHelper(2));
const frame=new THREE.Group();frame.rotation.x=-Math.PI/2;S.add(frame);   // sensor Z -> up
const att=new THREE.Group();att.rotation.order='ZYX';frame.add(att);       // roll(X) pitch(Y) yaw(Z)
function part(g,c){g.rotateX(Math.PI/2);return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,metalness:.4,roughness:.4}))}
const body=part(new THREE.CylinderGeometry(.35,.35,2,32),0xe5e7eb);
const nose=part(new THREE.ConeGeometry(.35,.8,32),0xef4444);nose.position.z=1.4;
const band=part(new THREE.CylinderGeometry(.36,.36,.25,32),0x38bdf8);band.position.z=.5;
att.add(body,nose,band);
for(let i=0;i<4;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(.04,.5,.6),new THREE.MeshStandardMaterial({color:0xef4444}));
 const a=i*Math.PI/2;f.position.set(Math.cos(a)*.5,Math.sin(a)*.5,-.8);f.rotation.z=a+Math.PI/2;f.rotation.x=0;att.add(f)}
const arrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,0),2.2,0x4ade80);att.add(arrow);
function resize(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let drag=false,az=.6,el=.4,dist=7;
R.domElement.onmousedown=()=>drag=true;addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(drag){az-=e.movementX*.01;el=Math.max(-1.4,Math.min(1.4,el+e.movementY*.01))}});
R.domElement.onwheel=e=>{dist=Math.max(3,Math.min(15,dist+e.deltaY*.005));e.preventDefault()};
(function loop(){cam.position.set(dist*Math.cos(el)*Math.sin(az),dist*Math.sin(el),dist*Math.cos(el)*Math.cos(az));cam.lookAt(0,0,0);R.render(S,cam);requestAnimationFrame(loop)})();

// ---------- data ----------
const rows=[];let max={alt:0,vs:0,g:0},t0=null,rollO=0,pitchO=0,yawO=0,last=null;
const H='ms,ax,ay,az,gx,gy,gz,roll,pitch,yaw,temp,hum,press,alt,vs'.split(',');
function ingest(v){ // v = array of 15 numbers
  const d={};H.forEach((k,i)=>d[k]=v[i]);last=d;rows.push(v);if(rows.length>20000)rows.shift();
  if(t0===null)t0=d.ms;const g=Math.hypot(d.ax,d.ay,d.az),spin=Math.hypot(d.gx,d.gy,d.gz);
  max.alt=Math.max(max.alt,d.alt);max.vs=Math.max(max.vs,Math.abs(d.vs));max.g=Math.max(max.g,g);
  const D=Math.PI/180;att.rotation.set((d.roll-rollO)*D,(d.pitch-pitchO)*D,(d.yaw-yawO)*D);
  $('alt').textContent=d.alt.toFixed(1);$('vs').textContent=d.vs.toFixed(1);
  $('mAlt').textContent=max.alt.toFixed(1);$('mVs').textContent=max.vs.toFixed(1);$('mG').textContent=max.g.toFixed(1);
  $('tmp').textContent=d.temp.toFixed(1);$('hum').textContent=d.hum.toFixed(0);$('prs').textContent=d.press.toFixed(1);
  $('rl').textContent=(d.roll-rollO).toFixed(0);$('pt').textContent=(d.pitch-pitchO).toFixed(0);$('yw').textContent=(d.yaw-yawO).toFixed(0);
  $('ag').textContent=g.toFixed(2);$('sp').textContent=spin.toFixed(0);$('tm').textContent=((d.ms-t0)/1000).toFixed(1);
  $('ph').textContent=d.alt<3&&max.alt<5?'PAD':d.vs>2?'ASCENT':(d.vs<-2?'DESCENT':(max.alt>10?(d.alt<3?'LANDED':'APOGEE'):'PAD'));
  $('hud').innerHTML=`ALT <b>${d.alt.toFixed(1)} m</b><br>V/S <b>${d.vs.toFixed(1)} m/s</b><br>R/P/Y <b>${(d.roll-rollO).toFixed(0)}° ${(d.pitch-pitchO).toFixed(0)}° ${(d.yaw-yawO).toFixed(0)}°</b>`;
}
function chart(cv,idx,col,label,f=1){const w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio,x=cv.getContext('2d');
  const a=rows.slice(-300).map(r=>r[idx]*f);x.clearRect(0,0,w,h);x.fillStyle='#7d8aa3';x.font=`${11*devicePixelRatio}px sans-serif`;x.fillText(label,8,14*devicePixelRatio);
  if(a.length<2)return;let lo=Math.min(...a),hi=Math.max(...a);if(hi-lo<1e-6){hi+=1;lo-=1}
  x.strokeStyle=col;x.lineWidth=2*devicePixelRatio;x.beginPath();a.forEach((v,i)=>{const X=i/(a.length-1)*w,Y=h-8-(v-lo)/(hi-lo)*(h-30*devicePixelRatio);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();
  x.fillStyle='#e6edf7';x.fillText(hi.toFixed(1),w-50*devicePixelRatio,14*devicePixelRatio)}
setInterval(()=>{chart($('c1'),13,'#4cc9f0','Altitude (m)');chart($('c2'),14,'#4ade80','Vertical speed (m/s)');chart($('c3'),3,'#fbbf24','Accel Z (g)')},200);

// ---------- Serial ----------
let port,writer,demo=null;
$('bC').onclick=async()=>{
  if(!('serial' in navigator))return alert('Web Serial needs Chrome or Edge (desktop/Android).');
  try{stopDemo();port=await navigator.serial.requestPort();await port.open({baudRate:115200});$('st').textContent='connected';$('st').style.color='var(--ok)';
  writer=port.writable.getWriter();const rd=port.readable.pipeThrough(new TextDecoderStream()).getReader();let buf='';
  for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;let n;while((n=buf.indexOf('\n'))>=0){const l=buf.slice(0,n).trim();buf=buf.slice(n+1);
   if(l.startsWith('D,')){const v=l.slice(2).split(',').map(Number);if(v.length===15&&v.every(isFinite))ingest(v)}}}
  }catch(e){$('st').textContent='error: '+e.message}};
$('bZ').onclick=async()=>{if(last){rollO=last.roll;pitchO=last.pitch;yawO=last.yaw}max={alt:0,vs:0,g:0};
  if(writer)await writer.write(new TextEncoder().encode('z'))};   // also re-zeros altitude on the ESP32
$('bS').onclick=()=>{const b=new Blob([H.join(',')+'\n'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cansat_'+Date.now()+'.csv';a.click()};

// ---------- Demo flight ----------
function stopDemo(){if(demo){clearInterval(demo);demo=null}}
$('bD').onclick=()=>{if(demo){stopDemo();$('st').textContent='demo stopped';return}
  rows.length=0;max={alt:0,vs:0,g:0};t0=null;let t=0,yaw=0,alt=0;$('st').textContent='DEMO';$('st').style.color='var(--wa)';
  demo=setInterval(()=>{t+=.05;let vs,a=1,tilt=0;
   if(t<2){vs=t*35;a=6;tilt=3}else if(t<9){vs=70-(t-2)*10;a=.3;tilt=10+(t-2)*10}else if(t<10){vs=-5;a=1.5;tilt=70}else{vs=-6;a=1;tilt=20}
   alt=Math.max(0,alt+vs*.05);if(alt===0&&t>12){t=0;alt=0;yaw=0}
   yaw+=(t<9?120:25)*.05;const r=Math.sin(t*1.3)*tilt*.5,p=tilt*Math.cos(t*.7)*.5;
   ingest([Math.round(t*1000),0,0,a,0,0,120,r,p,yaw%360,24+Math.random()*.2,60,1013-alt*.12,alt,vs])},50)};
</script></body></html>
